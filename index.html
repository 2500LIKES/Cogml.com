<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ซองอั่งเปา</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#260000,#5b0000);
  color:#fff;
}

.box{
  width:90%;
  max-width:380px;
  padding:30px 24px;
  border-radius:22px;
  background:rgba(20,20,20,.94);
  box-shadow:0 0 35px rgba(255,0,0,.25);
  text-align:center;
}

.icon{
  font-size:65px;
  margin-bottom:10px;
}

.check{
  font-size:70px;
  margin:15px;
}

h1{
  margin:5px 0 10px;
}

p{
  color:#ccc;
}

input{
  width:100%;
  padding:15px;
  border:0;
  outline:0;
  border-radius:12px;
  margin:15px 0;
  text-align:center;
  font-size:18px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#e00000;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ff1717;
}

.hidden{
  display:none;
}

.error{
  color:#ff5555;
  margin-top:12px;
}

.small{
  font-size:14px;
  color:#999;
}
</style>
</head>

<body>

<!-- หน้า 1 : ใส่รหัส -->
<div class="box" id="page1">
  <div class="icon">🧧</div>

  <h1>ซองอั่งเปา</h1>

  <p>กรอกรหัสซองเพื่อดำเนินการต่อ</p>

  <input
    id="code"
    type="text"
    placeholder="กรอกรหัส"
    maxlength="20"
  >

  <button onclick="checkCode()">ยืนยัน</button>

  <div id="error" class="error"></div>
</div>


<!-- หน้า 2 : ยืนยัน -->
<div class="box hidden" id="page2">
  <div class="check">🤖</div>

  <h1>ยืนยันตัวตน</h1>

  <p>คุณใช่บอทหรือไม่?</p>

  <button onclick="goToGift()">ไม่ใช่บอท ✓</button>

  <p class="small">
    การยืนยันนี้เป็นเพียงขั้นตอนของหน้าเว็บทดลอง
  </p>
</div>


<script>
function checkCode(){

  const code =
    document.getElementById("code").value.trim();

  const error =
    document.getElementById("error");

  if(code === "5000"){

    document
      .getElementById("page1")
      .classList.add("hidden");

    document
      .getElementById("page2")
      .classList.remove("hidden");

  }else{

    error.textContent = "❌ รหัสไม่ถูกต้อง";

  }
}


function goToGift(){

  window.location.href =
    "https://gift.truemoney.com/campaign/?v=01a09f6eaec67439b820dd681569dd049c";

}
</script>

</body>

</html>
