<!DOCTYPE html><!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำถามสำคัญ</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        h1 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .btn-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            position: relative;
            height: 50px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 45%;
            position: absolute;
        }
        .btn-yes {
            background-color: #2ecc71;
            color: white;
            left: 5%;
        }
        .btn-yes:hover {
            background-color: #27ae60;
        }
        .btn-no {
            background-color: #e74c3c;
            color: white;
            right: 5%;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>เจ้าของกลุ่มหล่อไหม? 🤔</h1>
        <div class="btn-container">
            <button class="btn btn-yes" onclick="answerYes()">หล่อ</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">ไม่หล่อ</button>
        </div>
    </div>

    <script>
        function answerYes() {
            // ลิงก์ปลายทางใหม่ที่คุณระบุไว้
            window.location.href = "https://gift.truemoney.com/campaign?v=019fe63f20b37595268b424f00b1b2e76cz";
        }

        function moveButton() {
            const btn = document.getElementById('noBtn');
            // สุ่มตำแหน่งใหม่ให้ปุ่มวิ่งหนีรอบหน้าจอเมื่อเอาเมาส์ไปชี้หรือกด
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>

</body>
</html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>

    <script src="./script.js"></script>
  </body>
</html>
